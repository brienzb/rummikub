<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>루미큐브 한글 워드</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Static -->
    <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Container -->
    <div class="container">
        <!-- 제목 -->
        <div class="d-flex justify-content-center mt-5 mb-5">
            <div class="text-center">
                <h1>Rummikub Hangeul Word</h1>
                <h3>루미큐브 한글 워드</h3>
            </div>
        </div>

        <!-- 닉네임 -->
        <div class="d-flex justify-content-center mb-5">
            <div class="border border-secondary border-opacity-50 rounded w-50 pt-4 pb-4 ps-2 pe-2">
                <div class="row">
                    <div class="text-center">
                        <h4>닉네임</h4>
                    </div>
                    <div class="text-center mb-2">
                        <span id="currentNickname"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="input-group">
                        <input id="nickname" type="text" class="form-control" placeholder="닉네임을 입력해 주세요" aria-label="닉네임을 입력해 주세요">
                        <button id="createUser" type="button" class="btn btn-outline-secondary">생성</button>
                        <div class="invalid-feedback">닉네임이 너무 짧거나 깁니다 (최소 1자 이상, 최대 20자 이하)</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 방 -->
        <div class="d-flex justify-content-center mt-2 mb-2">
            <div class="w-50">
                <div class="row mb-2">
                    <button id="showCreateRoomModel" type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createRoomModal">방 만들기</button>
                </div>
                <div class="row mb-2">
                    <button id="showEnterRoomModal" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#enterRoomModal">방 접속하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <!-- 방 만들기 모달 -->
    <div id="createRoomModal" class="modal fade" tabindex="-1" aria-labelledby="createRoomModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">방 만들기</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="mb-2">플레이 할 유저 수</div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="playUserCount" id="play2User" value="2" checked>
                            <label class="form-check-label" for="play2User">2</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="playUserCount" id="play3User" value="3">
                            <label class="form-check-label" for="play3User">3</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="playUserCount" id="play4User" value="4">
                            <label class="form-check-label" for="play4User">4</label>
                        </div>
                    </div>
                    <div>
                        <div class="mb-2">턴 타임</div>
                        <select id="turnTime" class="form-select" aria-label="턴 타임">
                            <option value="15">15초</option>
                            <option value="30">30초</option>
                            <option value="40">40초</option>
                            <option value="60" selected>60초</option>
                            <option value="120">120초</option>
                            <option value="-1">시간 제한 없음</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button id="createRoom" type="button" class="btn btn-primary">접속하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 방 접속하기 모달 -->
    <div id="enterRoomModal" class="modal fade" tabindex="-1" aria-labelledby="enterRoomModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">방 접속하기</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input id="roomId" type="text" class="form-control" placeholder="방 ID를 입력해 주세요" aria-label="방 ID를 입력해 주세요">
                    <div class="invalid-feedback">올바른 방 ID 값이 아닙니다</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button id="enterRoom" type="button" class="btn btn-primary">접속하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert -->
    <!-- 잘못 입력 알림 -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
        <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </symbol>
    </svg>
    <div id="wrongInputAlert" class="customAlert">
        <div class="alert alert-danger d-flex align-items-center" role="alert">
            <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>
            <div id="wrongInputAlertMessage"></div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- Static -->
    <script src="{{ url_for('static', path='/js/util.js') }}"></script>
    <script src="{{ url_for('static', path='/js/index.js') }}"></script>
</body>
</html>
